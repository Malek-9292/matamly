name: Matamly Android Cashier APK
on:
  push:
    branches: [development, feature/unified-android-cashier]
    paths:
      - "android-print/**"
      - "server/restaurant-db.ts"
      - ".github/workflows/android-print.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-print
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: matamly-android-cashier-debug
          path: android-print/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error