name: Matamly Customer iOS App

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS Matamly server URL used by this prototype build"
        required: true
        type: string

jobs:
  build-customer-ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate

      - name: Build existing Matamly web client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Validate server URL
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          case "$SERVER_URL" in
            https://*) ;;
            *) echo "The server URL must use HTTPS"; exit 1 ;;
          esac

      - name: Install customer app dependencies
        working-directory: customer-app
        run: npm install

      - name: Generate and sync iOS project
        working-directory: customer-app
        env:
          MATAMLY_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Simulator app
        working-directory: customer-app/ios
        run: |
          xcodebuild -workspace App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: matamly-customer-ios-simulator-debug
          path: customer-app/ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
