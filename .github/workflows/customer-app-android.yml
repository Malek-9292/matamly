name: Matamly Customer Android App

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS Matamly server URL used by this prototype build"
        required: true
        type: string
  push:
    branches: [feature/unified-android-cashier]
    paths:
      - "customer-app/**"
      - ".github/workflows/customer-app-android.yml"

jobs:
  build-customer-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate server URL
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "For push builds, set the server URL as a repository variable named MATAMLY_SERVER_URL and dispatch this workflow manually with the URL."
            exit 1
          fi
          case "$SERVER_URL" in
            https://*) ;;
            *) echo "The server URL must use HTTPS"; exit 1 ;;
          esac

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install customer app dependencies
        working-directory: customer-app
        run: npm install

      - name: Generate Android project
        working-directory: customer-app
        env:
          MATAMLY_SERVER_URL: ${{ github.event.inputs.server_url || vars.MATAMLY_SERVER_URL }}
        run: |
          test -n "$MATAMLY_SERVER_URL"
          npx cap add android

      - name: Sync native project
        working-directory: customer-app
        env:
          MATAMLY_SERVER_URL: ${{ github.event.inputs.server_url || vars.MATAMLY_SERVER_URL }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: customer-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload customer app APK
        uses: actions/upload-artifact@v4
        with:
          name: matamly-customer-android-debug
          path: customer-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
