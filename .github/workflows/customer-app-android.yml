name: Matamly Customer Android App

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Exact isolated HTTPS Matamly preview URL for this prototype build"
        required: true
        type: string

jobs:
  build-customer-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate

      - name: Build existing Matamly web client
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate server URL
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "Set repository variable MATAMLY_SERVER_URL or provide server_url when dispatching this workflow."
            exit 1
          fi
          case "$SERVER_URL" in
            https://*) ;;
            *) echo "The server URL must use HTTPS"; exit 1 ;;
          esac

      - name: Install customer app dependencies
        working-directory: customer-app
        run: npm install

      - name: Generate Android project
        working-directory: customer-app
        env:
          MATAMLY_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: npx cap add android

      - name: Sync native project
        working-directory: customer-app
        env:
          MATAMLY_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: customer-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload customer app APK
        uses: actions/upload-artifact@v4
        with:
          name: matamly-customer-android-debug
          path: customer-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
