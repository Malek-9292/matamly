services:
  mysql:
    image: mysql:8.4
    container_name: matamly-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: matamly
    volumes:
      - matamly-mysql:/var/lib/mysql
    ports:
      - "3306:3306"
  matamly:
    build: .
    container_name: matamly-app
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      CASHIER_PASSWORD: ${CASHIER_PASSWORD:?Set CASHIER_PASSWORD in .env}
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN:?Set PRINT_AGENT_TOKEN in .env}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/matamly
      MATAMLY_DATA_FILE: /app/data/matamly.json
    volumes:
      - matamly-data:/app/data
volumes:
  matamly-data:
  matamly-mysql:
